<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hanamikoji</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="mode-selection-screen" class="mode-selection-screen">
      <div class="mode-selection-card">
        <h1>Játékmód választás</h1>
        <p>Válaszd ki, hogy egyedül a számítógép ellen vagy két játékosként játszol.</p>
        <div class="mode-buttons">
          <button id="single-player-button" class="primary" type="button">Egyjátékos</button>
          <button id="multiplayer-button" class="secondary" type="button">Kétjátékos</button>
        </div>
      </div>
    </div>

    <section id="opponent-hand" class="opponent-hand">
      <div id="opponent-hand-list" class="opponent-hand-list"></div>
    </section>

    <section id="message" class="message-panel">Click an action to start.</section>

    <section class="game-area">
      <div id="board-container" class="board-container"></div>
      <div id="deck-container" class="deck-container"></div>
    </section>

    <section id="hand-panel" class="hand-panel">
      <div id="hand-list" class="hand-list"></div>
    </section>

    <section class="controls-panel">
        <h2>Actions</h2>
        <div class="action-buttons">
          <button id="secret-button">1. Secret</button>
          <button id="tradeoff-button">2. Tradeoff</button>
          <button id="gift-button">3. Gift</button>
          <button id="competition-button">4. Competition</button>
        </div>
        <div class="confirm-panel">
          <button id="confirm-button" class="primary">Confirm</button>
          <button id="restart-button" class="secondary">New Game</button>
        </div>
      </section>

    <section id="offer-panel" class="offer-panel hidden"></section>

    <section id="result-panel" class="result-panel hidden"></section>

    <div id="transition-screen" class="transition-screen hidden">
      <div class="transition-content">
        <h1 id="transition-title">Player 1's turn</h1>
        <p id="transition-text">After acknowledging, the upcoming player's hand will be visible. Please do not look at the screen.</p>
        <button id="transition-button" class="primary" type="button">Continue</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
